[package]
name = "shuo"
version = "0.2.0"
description = "Shuo — 本地语音识别"
authors = ["a2heng"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.95"

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.5", features = ["tray-icon", "image-png"] }
# devtools：调试期在 release 也保留 WebView 开发者工具（无控制台的机器上唯一可交互的调试口）
tauri-runtime-wry = { version = "3.0.0-alpha.5", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ONNX 推理（构建时下载 onnxruntime 并把动态库复制到产物旁）
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
  "std",
  "download-binaries",
  "copy-dylibs",
  "tls-native",
  "api-27",
] }
# ============================================================================
# llama.cpp（GGUF 运行时）：Qwen3-ASR-1.7B 主推理路径（提示词控制输出风格）。
# **源码静态链接**进可执行文件（无 llama.dll / ggml*.so 伴生）；mtmd feature 提供
# 多模态音频路径（bindgen 自动生成 mtmd_* 绑定，qsa 已验证 0.1.157 可用）。
# 版本 "=" 精确锁定：crate 内嵌 llama.cpp 源码构建，ABI 与 mtmd 头文件强绑定，
# 升级需同步回归 gguf-e2e。CPU 后端静态编入；ort 保留给降噪模型与 LLM 后处理段。
# 构建依赖：cmake + C/C++ 编译器 + libclang（bindgen）；CI 各腿的准备步骤见 ci.yml。
# ============================================================================
llama-cpp-sys-2 = { version = "=0.1.157", default-features = false, features = [
  "openmp",
  "mtmd",
] }
# 麦克风采集（Windows WASAPI / Linux ALSA）
cpal = "0.18"
# 重采样（录音设备原生采样率 → 16 kHz）
rubato = "5"
# 文本分词（Qwen tokenizer.json）
tokenizers = { version = "0.22", default-features = false, features = [
  "onig",
  "progressbar",
  "esaxx_fast",
] }
# 模型一键下载（GitHub Release API + 资产流式落盘；阻塞式 HTTP，跑在独立线程）。
# platform-verifier：TLS 证书走**系统信任库**（而非编译期烘焙的 webpki-roots），
# 企业/本地代理做 TLS 拦截时，其 CA 只要装进操作系统即可正常下载。
ureq = { version = "3", features = ["platform-verifier"] }
# 梅尔频谱 / 降噪 STFT
rustfft = "6"

[target.'cfg(target_os = "linux")'.dependencies]
# 全局热键（Wayland/X11 通用）：xdg-desktop-portal 的 GlobalShortcuts
# （GNOME 48+/KDE 均有实现，按下/松开都有信号，正好对应「按住说话」）
ashpd = { version = "0.13", default-features = false, features = [
  "global_shortcuts",
  "remote_desktop",
  "screencast",
  "async-io",
] }
# 门户的设备类型是 enumflags2 位标志
enumflags2 = "0.7"
# 跑 ashpd 的异步代码（在独立线程里 block_on）
futures-lite = "2"
async-io = "2"
# evdev 兜底（portal 不可用 / 鼠标侧键）：O_NONBLOCK、ioctl
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 全局热键（低级键鼠钩子，按下/松开都要）+ 自动输入（SendInput / KEYEVENTF_UNICODE）
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
