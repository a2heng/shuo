# 说 · Shuo — 打包 / 发版
#
# 触发：推 tag `v*`（例如 `git tag v26.10.25 && git push origin v26.10.25`，
#       或直接跑 `./scripts/release.sh`），或手动 `workflow_dispatch`（只构建，不建 release）。
#
# 版本号的唯一来源是 tag：第一个 job 把 tag 解析成 `version` 输出，
# 后面每个 job 都通过 needs 拿到它，再交给 scripts/set-version.sh 写进构建配置。
# 仓库里的版本字段只是本地开发占位，发版时不要在本地改、也不要提交。
#
# 不做缓存：每次都是干净构建，省心、结果可复现。
# 产物：Windows NSIS / Linux deb + AppImage，统一挂到同一个 release（不带 zip）。
name: 打包发版

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则用当天日期 YY.MM.DD）"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  # AppImage 的 linuxdeploy 需要 FUSE，CI 里用解包运行模式
  APPIMAGE_EXTRACT_AND_RUN: "1"
  TAURI_CLI_VERSION: "3.0.0-alpha.5"

jobs:
  # ------------------------------------------------------------- 版本号
  version:
    name: 版本号（tag → version）
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            V="$INPUT_VERSION"
          else
            V="$(date +%y.%m.%d)"
          fi
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "版本号不合法：$V（要求 semver，如 26.10.25 或 26.10.25-2）" >&2
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "本次版本：$V"

  # ------------------------------------------------------------- Windows
  windows:
    name: Windows · NSIS
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 版本号写入构建配置（tag → tauri.conf.json + Cargo.toml）
        run: bash ./scripts/set-version.sh "$VERSION"

      - uses: dtolnay/rust-toolchain@stable

      # llama-cpp-sys-2（bindgen）需要 libclang；预装则用，缺则 choco 装（ci.yml 同款）
      - name: 准备 libclang（bindgen 用）
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\LLVM\bin",
            "${env:ChocolateyInstall}\lib\llvm\tools\LLVM\bin"
          )
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ 'libclang.dll') } | Select-Object -First 1
          if (-not $found) {
            Write-Host 'libclang not found, installing LLVM via choco ...'
            choco install llvm --no-progress -y | Out-Null
            $found = "$env:ProgramFiles\LLVM\bin"
            if (-not (Test-Path (Join-Path $found 'libclang.dll'))) { throw 'LLVM installation failed' }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$found"

      - name: 安装 tauri-cli
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
          fi

      - name: 构建 NSIS
        working-directory: src-tauri
        run: cargo tauri build

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # --------------------------------------------------------------- Linux
  linux:
    name: Linux · deb + AppImage
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 系统依赖（WebKitGTK 4.1 / ALSA / AppImage）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev librsvg2-dev \
            libgtk-3-dev libasound2-dev libsoup-3.0-dev \
            pkg-config file

      - name: 准备 libclang（llama-cpp-sys-2 的 bindgen 用）
        run: |
          set -e
          if ! ldconfig -p | grep -q libclang; then
            sudo apt-get install -y -qq libclang-dev clang >/dev/null
          fi
          LIBCLANG=$(dirname "$(find /usr/lib -name 'libclang.so*' 2>/dev/null | head -1)")
          echo "LIBCLANG_PATH=$LIBCLANG" >> "$GITHUB_ENV"

      - name: 版本号写入构建配置（tag → tauri.conf.json + Cargo.toml）
        run: bash ./scripts/set-version.sh "$VERSION"

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 tauri-cli
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
          fi

      - name: 构建 deb + AppImage
        working-directory: src-tauri
        run: cargo tauri build --bundles deb,appimage

      - name: 上传 deb
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: 上传 AppImage
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # -------------------------------------------------------------- Release
  release:
    name: 创建 Release
    needs: [version, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: 整理产物与版本号
        run: |
          mkdir -p out
          cp artifacts/*.deb "out/Shuo_${VERSION}_amd64.deb"
          cp artifacts/*.AppImage "out/Shuo_${VERSION}_amd64.AppImage"
          cp artifacts/*-setup.exe "out/Shuo_${VERSION}_x64-setup.exe"
          ls -lh out

      - name: 校验产物（真实安装包 + 带版本号，不能是 zip）
        run: |
          set -e
          n=$(find out -maxdepth 1 -type f | wc -l)
          test "$n" -eq 3 || { echo "产物数量不对：$n"; ls -l out; exit 1; }
          if ls out/*.zip >/dev/null 2>&1; then
            echo "Release 里出现 zip：artifact 没有被解压"; exit 1
          fi
          for f in out/*; do
            case "$f" in
              *"${VERSION}"*) ;;
              *) echo "文件名缺少版本号：$f"; exit 1 ;;
            esac
          done
          file out/*

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "说 · Shuo ${VERSION}" \
              --notes "Windows: NSIS 安装包；Linux: deb + AppImage。模型不随包分发：首次启动点「设置 → 模型与引擎 → 下载模型」从 ModelScope 拉取微调模型包（约 1.4 GB，模型作者 OrientCOMPASS），或用 SHUO_MODEL_ENDPOINT 指定镜像（详见 README）。"
          fi
